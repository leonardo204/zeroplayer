name: zeroPlayer

options:
  bundleIdPrefix: com.zerolive
  developmentLanguage: ko
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: XU8HS9JUTS
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  # AdMob. 의존성은 SPM 만 쓴다(CocoaPods 를 쓰지 않는다).
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: "12.0.0"

targets:
  zeroPlayer:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: GoogleMobileAds
    configFiles:
      Debug: Configs/Base.xcconfig
      Release: Configs/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zerolive.cloudRadioN
        PRODUCT_NAME: zeroPlayer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
      # 푸시는 개발과 배포의 APNs 환경이 달라 엔타이틀먼트를 따로 둔다.
      # 이 값이 없으면 실기기에서 registerForRemoteNotifications 가
      # NSCocoaErrorDomain 3000 ('aps-environment 를 찾을 수 없습니다')으로 실패한다.
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Sources/App/zeroPlayer.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Sources/App/zeroPlayerRelease.entitlements
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: zeroPlayer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        CFBundleLocalizations:
          - ko
          - en
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsForMedia: true
        ZPProxyBaseURL: $(ZP_PROXY_BASE_URL)
        GADApplicationIdentifier: $(ZP_ADMOB_APP_ID)
        ZPAdUnitRecommend: $(ZP_ADMOB_BANNER_RECOMMEND)
        ZPAdUnitDiscover: $(ZP_ADMOB_BANNER_DISCOVER)
        ZPAdUnitPresets: $(ZP_ADMOB_BANNER_PRESETS)
        ZPAdUnitStats: $(ZP_ADMOB_BANNER_STATS)
        NSUserTrackingUsageDescription: 관심사에 맞는 광고를 보여주는 데에만 씁니다. 허용하지 않아도 앱 기능은 모두 그대로 쓸 수 있고, 광고가 관심사와 무관한 것으로 바뀔 뿐입니다.
