name: zeroPlayer

options:
  bundleIdPrefix: com.zerolive
  developmentLanguage: ko
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: XU8HS9JUTS
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  # AdMob. 의존성은 SPM 만 쓴다(CocoaPods 를 쓰지 않는다).
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: "12.0.0"

targets:
  zeroPlayer:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: GoogleMobileAds
    # 광고 ID 가 빌드마다 다르다. Debug 는 구글 테스트 ID, Release 는 실제 단위다.
    configFiles:
      Debug: Configs/Debug.xcconfig
      Release: Configs/Release.xcconfig
    # 테스트 ID 로 아카이브하면 출시 첫날 수익이 0 이고 빌드를 다시 올려야 한다.
    # 아카이브(ACTION=install)일 때만 막는다 — 평소 Release 빌드는 그대로 된다.
    preBuildScripts:
      - name: AdMob ID 확인
        basedOnDependencyAnalysis: false
        script: |
          if [ "$ACTION" != "install" ]; then exit 0; fi
          for value in "$ZP_ADMOB_APP_ID" "$ZP_ADMOB_BANNER_RECOMMEND" \
                       "$ZP_ADMOB_BANNER_DISCOVER" "$ZP_ADMOB_BANNER_PRESETS" \
                       "$ZP_ADMOB_BANNER_STATS"; do
            case "$value" in
              *3940256099942544*)
                echo "error: AdMob 값이 아직 구글 테스트 ID 다($value). Configs/Release.xcconfig 를 채운다."
                exit 1
                ;;
            esac
          done
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zerolive.cloudRadioN
        PRODUCT_NAME: zeroPlayer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # 아이폰과 아이패드 둘 다. 1.7 이 아이패드를 지원했으므로 줄일 수 없다 —
        # 업데이트가 이전 판이 받쳐 주던 기기를 빼면 애플이 심사 전 검증에서 막는다
        # ("This bundle does not support one or more of the devices supported by
        # the previous app version", QA1623). 스크린샷도 두 기기 것을 다 올린다.
        TARGETED_DEVICE_FAMILY: "1,2"
      # 푸시는 개발과 배포의 APNs 환경이 달라 엔타이틀먼트를 따로 둔다.
      # 이 값이 없으면 실기기에서 registerForRemoteNotifications 가
      # NSCocoaErrorDomain 3000 ('aps-environment 를 찾을 수 없습니다')으로 실패한다.
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Sources/App/zeroPlayer.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Sources/App/zeroPlayerRelease.entitlements
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: zeroPlayer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        CFBundleLocalizations:
          - ko
          - en
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # 아이패드는 네 방향을 다 적어야 한다. 하나라도 빠지면 업로드가 막힌다
        # ("you need to include all of the ... orientations to support iPad
        # multitasking"). 예전에는 UIRequiresFullScreen 으로 멀티태스킹을 빠져나갈 수
        # 있었지만 iPadOS 26 에서 그 키가 무시된다. 아이폰은 세로 하나로 둔다.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsForMedia: true
        ZPProxyBaseURL: $(ZP_PROXY_BASE_URL)
        GADApplicationIdentifier: $(ZP_ADMOB_APP_ID)
        ZPAdUnitRecommend: $(ZP_ADMOB_BANNER_RECOMMEND)
        ZPAdUnitDiscover: $(ZP_ADMOB_BANNER_DISCOVER)
        ZPAdUnitPresets: $(ZP_ADMOB_BANNER_PRESETS)
        ZPAdUnitStats: $(ZP_ADMOB_BANNER_STATS)
        NSUserTrackingUsageDescription: 관심사에 맞는 광고를 보여주는 데에만 씁니다. 허용하지 않아도 앱 기능은 모두 그대로 쓸 수 있고, 광고가 관심사와 무관한 것으로 바뀔 뿐입니다.
